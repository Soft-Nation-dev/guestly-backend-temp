name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/app.js
      - run: node --check src/server.js
      - run: npm test
      - run: npm run cf:build
      - name: Smoke test Cloudflare Worker locally
        run: |
          printf 'MONGODB_URI="mongodb://127.0.0.1:27017/guestly-cloudflare-test"\nJWT_SECRET="guestly-cloudflare-local-test-secret-32-characters"\nPAYSTACK_SECRET_KEY="sk_test_fixture_key"\nCHECKIN_DOCUMENT_KEY="%s"\n' "$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")" > .dev.vars
          npm run cf:dev -- --port 8787 > /tmp/guestly-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            status=$(curl -sS --max-time 2 -o /tmp/guestly-worker-health.json -w '%{http_code}' http://127.0.0.1:8787/health || true)
            if [ "$status" = 200 ]; then
              ready=1
              break
            fi
            if [ "$status" = 503 ] || [ "$status" = 500 ]; then
              cat /tmp/guestly-worker.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/guestly-worker.log
            exit 1
          fi
          node -e "const r=require('/tmp/guestly-worker-health.json');if(r.success!==true||r.data.status!=='ok')process.exit(1)"
